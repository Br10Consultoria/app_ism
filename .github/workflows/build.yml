name: Validar backend e gerar APK Release Gertec

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend pytest -q backend/tests

  android:
    runs-on: ubuntu-latest
    env:
      # O backend publico e fixo; a TERMINAL_KEY so e cadastrada no equipamento.
      ORG_GRADLE_PROJECT_ismBackendUrl: https://app.ismtelecom.com.br
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Instalar SDK Android 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Carregar SDK Gertec GPOS780 988B e logo ISM (checksums validados)
        run: python3 scripts/install_gertec_sdk.py
      - name: Ativar AndroidX no CI
        run: echo "android.useAndroidX=true" >> android/gradle.properties
      - name: Preparar chave privada Release (somente execucao manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          ISM_KEYSTORE_BASE64: ${{ secrets.ISM_RELEASE_KEYSTORE_B64 }}
          ISM_STORE_PASSWORD: ${{ secrets.ISM_RELEASE_STORE_PASSWORD }}
          ISM_KEY_ALIAS: ${{ secrets.ISM_RELEASE_KEY_ALIAS }}
          ISM_KEY_PASSWORD: ${{ secrets.ISM_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ISM_KEYSTORE_BASE64" ]]; then
            echo "Chave Release ainda nao cadastrada. A build sera Release sem assinatura de desenvolvedor."
            exit 0
          fi
          if [[ -z "$ISM_STORE_PASSWORD" || -z "$ISM_KEY_ALIAS" || -z "$ISM_KEY_PASSWORD" ]]; then
            echo "::error::Configuracao de assinatura incompleta: faltam segredos ISM_RELEASE_*."
            exit 1
          fi
          printf '%s' "$ISM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ism-release.p12"
          chmod 600 "$RUNNER_TEMP/ism-release.p12"
          echo "Chave Release carregada em diretorio temporario; assinatura habilitada."
      - name: Compilar SOMENTE APK Release sem Debug
        env:
          ISM_RELEASE_STORE_FILE: ${{ runner.temp }}/ism-release.p12
          ISM_RELEASE_STORE_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.ISM_RELEASE_STORE_PASSWORD || '' }}
          ISM_RELEASE_KEY_ALIAS: ${{ github.event_name == 'workflow_dispatch' && secrets.ISM_RELEASE_KEY_ALIAS || '' }}
          ISM_RELEASE_KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.ISM_RELEASE_KEY_PASSWORD || '' }}
        run: gradle -p android :app:assembleRelease --no-daemon
      - name: Assinar Release com certificado de homologação ISM (temporário)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          # Chave EXCLUSIVA do APK de teste, criada do zero neste job.
          # Nunca substituir chave permanente de producao por esta chave.
          PASS="$(openssl rand -hex 24)"
          KEYSTORE="$RUNNER_TEMP/ism-homologacao.p12"
          keytool -genkeypair -storetype PKCS12 \
            -keystore "$KEYSTORE" -storepass "$PASS" \
            -alias ism-homologacao -keypass "$PASS" \
            -keyalg RSA -keysize 3072 -validity 365 \
            -dname "CN=ISM Telecom, OU=Homologacao, O=ISM Telecom, C=BR" \
            -noprompt >/dev/null 2>&1
          chmod 600 "$KEYSTORE"
          OUT="android/app/build/outputs/apk/release"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias ism-homologacao \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out "$OUT/app-release-homologacao.apk" \
            "$OUT/app-release-unsigned.apk"
          unset PASS
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose --print-certs "$OUT/app-release-homologacao.apk"
          echo "::warning::Assinatura Android de HOMOLOGACAO, temporaria e diferente em cada build. Nao usar para atualizacao/producao."
      - name: Validar modo Release, pacote e assinatura
        id: release_apk
        shell: bash
        run: |
          set -euo pipefail
          OUT="android/app/build/outputs/apk/release"
          if [[ -f "$OUT/app-release-homologacao.apk" ]]; then
            APK="$OUT/app-release-homologacao.apk"
            ARTIFACT="ism-telecom-v0.12.7-gpos780-988b-RELEASE-ASSINADO-HOMOLOGACAO"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
            echo "::warning::Certificado autoassinado ISM para TESTE, nao validado pela Gertec e nao reutilizavel em builds futuros."
          elif [[ -f "$OUT/app-release.apk" ]]; then
            APK="$OUT/app-release.apk"
            ARTIFACT="ism-telecom-v0.12.7-gpos780-988b-release-assinado"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
            echo "APK Release com assinatura Android verificada."
          elif [[ -f "$OUT/app-release-unsigned.apk" ]]; then
            APK="$OUT/app-release-unsigned.apk"
            ARTIFACT="ism-telecom-v0.12.7-gpos780-988b-release-NAO-ASSINADO"
            echo "::notice::APK Release sem assinatura Android. Nao instalar diretamente; confirmar com Gertec se o robo aceita APK unsigned."
          else
            echo "::error::Nenhum APK Release gerado."
            exit 1
          fi
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -q "name='br.com.ismtelecom.pos'"
          echo "$BADGING" | grep -q "versionCode='27'"
          if echo "$BADGING" | grep -q '^application-debuggable'; then
            echo "::error::O APK esta em modo debug e sera rejeitado pela Gertec."
            exit 1
          fi
          echo "Release verificado: android:debuggable nao ativo, pacote ISM, versionCode 27."
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT" >> "$GITHUB_OUTPUT"
      - name: Disponibilizar APK Release com estado de assinatura explicito
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release_apk.outputs.artifact_name }}
          path: ${{ steps.release_apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
