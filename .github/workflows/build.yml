name: Validar backend e gerar APK de testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend pytest -q backend/tests

  android:
    runs-on: ubuntu-latest
    env:
      # Somente na execucao manual. Em push/PR, APK segue sem acesso real.
      ORG_GRADLE_PROJECT_ismBackendUrl: ${{ github.event_name == 'workflow_dispatch' && 'https://app.ismtelecom.com.br' || '' }}
      ORG_GRADLE_PROJECT_ismTerminalKey: ${{ github.event_name == 'workflow_dispatch' && secrets.ISM_TERMINAL_KEY || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Instalar SDK Android 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Validar configuracao de homologacao
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ "${#ORG_GRADLE_PROJECT_ismTerminalKey}" -lt 32 ]; then
            echo "Configure o segredo ISM_TERMINAL_KEY (minimo 32 caracteres) em Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Ativar AndroidX no CI (sem gravar segredos)
        run: echo "android.useAndroidX=true" >> android/gradle.properties
      - run: gradle -p android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && 'ism-telecom-homologacao-apk' || 'ism-telecom-debug-apk' }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
