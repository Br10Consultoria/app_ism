plugins { id 'com.android.application' }

android {
    namespace 'br.com.ismtelecom.pos'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.ismtelecom.pos'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '0.11.8'
        def url = (project.findProperty('ismBackendUrl') ?: 'https://app.ismtelecom.com.br').toString()
        buildConfigField 'String', 'API_BASE', '"' + url.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    // SDK GEDI/PPComp oficial da Gertec GPOS780 (AARs sob autorizacao do fabricante)
    // Ausentes por padrao: o app mostra diagnostico e previa, nunca finge imprimir.
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
