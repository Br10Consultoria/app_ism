plugins { id 'com.android.application' }

android {
    namespace 'br.com.ismtelecom.pos'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.ismtelecom.pos'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
        def url = (project.findProperty('ismBackendUrl') ?: 'https://app.ismtelecom.com.br').toString()
        def key = (project.findProperty('ismTerminalKey') ?: '').toString()
        buildConfigField 'String', 'API_BASE', '"' + url.replace('\\', '\\\\').replace('"', '\\"') + '"'
        buildConfigField 'String', 'TERMINAL_KEY', '"' + key.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.core:core:1.13.1'
}
