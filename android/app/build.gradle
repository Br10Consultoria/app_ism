plugins { id 'com.android.application' }

def releaseKeystore = System.getenv('ISM_RELEASE_STORE_FILE')
def releaseStorePassword = System.getenv('ISM_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('ISM_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ISM_RELEASE_KEY_PASSWORD')
def hasReleaseSigning = [releaseKeystore, releaseStorePassword,
                         releaseKeyAlias, releaseKeyPassword]
        .every { it != null && !it.trim().isEmpty() } &&
        file(releaseKeystore).isFile()

android {
    namespace 'br.com.ismtelecom.pos'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.ismtelecom.pos'
        minSdk 26
        targetSdk 35
        versionCode 27
        versionName '0.12.7'
        def url = (project.findProperty('ismBackendUrl') ?: 'https://app.ismtelecom.com.br').toString()
        buildConfigField 'String', 'API_BASE', '"' + url.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }
    signingConfigs {
        // Chave de desenvolvedor permanente. O robô aplica a assinatura Gertec
        // na etapa seguinte. Nunca gravar keystore/senha no repositório.
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                storeType 'pkcs12'
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            // Sem secrets: assembleRelease gera app-release-unsigned.apk.
            // Com secrets (workflow_dispatch): APK release assinado.
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    // GEDI 2.2.6 / PPComp 1.39 / HCL 1.0.10, firmware 988B (SDK privado).
    // O CI valida hashes e extrai os AARs antes do build; ausencias falham o build.
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    implementation 'org.slf4j:slf4j-api:1.7.36' // interface de logs exigida por GEDI/PPComp/HCL
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
